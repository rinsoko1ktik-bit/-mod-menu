name: Build ZokiiStoryMenu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja

      - name: Build
        run: |
          cmake --build build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ZokiiStoryMenu-build
          path: build/
