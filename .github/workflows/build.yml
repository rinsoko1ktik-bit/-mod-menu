name: Build ZokiiStoryMenu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            clang \
            lld \
            make

      - name: Clone OpenOrbis Toolchain
        run: |
          git clone --depth 1 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git \
            OpenOrbis

      - name: Inspect OpenOrbis
        run: |
          echo "=== OpenOrbis bin ==="
          ls -la OpenOrbis/bin
          echo "=== OpenOrbis include ==="
          ls -la OpenOrbis/include
          echo "=== OpenOrbis lib ==="
          ls -la OpenOrbis/lib
          echo "=== OpenOrbis build ==="
          ls -la OpenOrbis/build

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja

      - name: Build
        run: |
          cmake --build build -v

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ZokiiStoryMenu-build
          path: build/
