name: Build Zokii Story Menu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            cmake \
            ninja-build \
            git \
            wget \
            unzip

      - name: Get OpenOrbis
        run: |
          git clone --depth 1 --branch v0.5.4 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git \
            "$HOME/OpenOrbis"

          echo "OpenOrbis:"
          ls -la "$HOME/OpenOrbis"

      - name: Configure
        env:
          OO_PS4_TOOLCHAIN: ${{ runner.tool_cache }}/OpenOrbis
        run: |
          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DOO_PS4_TOOLCHAIN="$HOME/OpenOrbis"

      - name: Build
        env:
          OO_PS4_TOOLCHAIN: ${{ runner.tool_cache }}/OpenOrbis
        run: |
          export OO_PS4_TOOLCHAIN="$HOME/OpenOrbis"
          cmake --build build --verbose
