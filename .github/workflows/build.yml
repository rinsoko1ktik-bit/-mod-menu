name: Build Зуки Story Menu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld git

      - name: Download OpenOrbis
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$HOME/OpenOrbis"

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --verbose

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: ZokiiStoryMenu-build
          path: build/
